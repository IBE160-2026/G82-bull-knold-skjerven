name: Tester

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Ingen ANTHROPIC_API_KEY: testmodus er på, og testrunneren tvinger den i tillegg.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Installer avhengigheter
        run: uv sync --locked
      - name: requirements.txt er i takt
        # pip-veien i README-en. `uv sync --locked` over sjekker at uv.lock er i takt med pyproject.toml.
        run: |
          uv export --no-hashes --frozen --no-dev -o requirements.txt
          git diff --exit-code requirements.txt
      - name: Migreringer er oppdatert
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Tester
        # Nettlesertesten (taggen nettleser) er utelatt her og kjøres i eget steg under.
        run: uv run python manage.py test
      - name: Chromium for nettlesertesten
        run: uv run playwright install --with-deps chromium
      - name: Nettlesertest med axe (SM-7)
        # axe-core mot skjermbildene. Brudd på WCAG 2.2 A/AA stopper merge.
        run: uv run python manage.py test --tag nettleser
      - name: Seed på tom database
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_testdata
