[project]
name = "farequiz"
version = "0.1.0"
description = "FåreQuiz: quizer fra egne notater, laget av KI"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.8,<3",
    "django>=5.2.19,<6",
    "python-docx==1.2.0",
    "python-dotenv==1.2.4",
    "whitenoise>=6.12.0",
]

[tool.ruff]
target-version = "py314"
# BMAD-verktøy og logger er ikke appkode. Migreringer lages av Django og
# lages på nytt ved konflikt, så de formateres og lintes ikke.
extend-exclude = [".claude", "_bmad", "_bmad-output", ".logs", "*/migrations/*"]

[tool.ruff.lint]
# Djangos Meta-klasser og REQUIRED_FIELDS bruker lister som klasseattributter.
ignore = ["RUF012"]

[dependency-groups]
dev = [
    "ruff==0.17.6",
]
